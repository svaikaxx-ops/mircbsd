name: Release

# Paleidžiama užkėlus žymą v*, pvz.: git tag v0.5.1 && git push origin v0.5.1
# Rankinis paleidimas (workflow_dispatch) tik sukompiliuoja ir patikrina
# binarus — release nekuriamas.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Tests
        run: cargo test --locked

      - name: Build
        shell: bash
        run: |
          # ring kompiliuoja C kodą: musl taikiniams — musl-gcc
          if [ "${{ matrix.musl }}" = "true" ]; then
            t="${{ matrix.target }}"; export "CC_${t//-/_}=musl-gcc"
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/mircbsd"
          file "$bin"
          "$bin" --version
          if [ "${{ matrix.musl }}" = "true" ]; then
            file "$bin" | grep -Eq "static(ally|-pie) linked" || { echo "musl binaris ne statinis"; exit 1; }
          fi

      - name: Package
        shell: bash
        run: |
          name="mircbsd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/mircbsd" README.md LICENSE CHANGELOG.md config.example "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            /^## \[/ { if (p) exit; if (index($0, "[" v "]")) p=1 }
            p
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "mircBSD ${GITHUB_REF_NAME}" > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "mircBSD $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
