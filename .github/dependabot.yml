version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Reikalauja naujesnio Rust nei rust-version = 1.85 (sha2 0.11 → 1.88,
      # parking_lot 0.13 → 1.95). Pakelti kartu su minimalia Rust versija.
      - dependency-name: sha2
        versions: [">= 0.11"]
      - dependency-name: parking_lot
        versions: [">= 0.13"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # minimum-rust darbas sąmoningai prisegtas prie 1.85.0
      - dependency-name: dtolnay/rust-toolchain
