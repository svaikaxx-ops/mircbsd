[package]
name = "mircbsd"
version = "0.4.8"
edition = "2021"
rust-version = "1.85"
description = "Terminalo IRC klientas (Debian/FreeBSD)"
license = "MIT"
authors = ["mircBSD contributors"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "mircbsd"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
sha2 = "0.11"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-general-category = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
